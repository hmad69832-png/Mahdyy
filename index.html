<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مهدي التعليمية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<header class="p-5 flex justify-between items-center max-w-6xl mx-auto">
<h1 class="text-2xl font-black text-yellow-400">مهدي</h1>
<button class="bg-white text-black px-5 py-2 rounded-full font-bold">دخول</button>
</header>
<section class="max-w-6xl mx-auto p-6 text-center mt-10">
<h2 class="text-4xl md:text-6xl font-black leading-tight">منصتك للدراسة<br><span class="text-yellow-400">بذكاء مش بمجهود</span></h2>
<p class="mt-6 text-gray-400 text-lg">فيديوهات، مذكرات، واختبارات كلها في مكان واحد</p>
<button class="mt-8 bg-yellow-400 text-black px-10 py-4 rounded-full font-black text-xl">ابدأ الآن مجانا</button>
<div class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-16 text-right">
<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800"><h3 class="font-bold text-xl">📚 شرح مبسط</h3><p class="text-gray-400 mt-2">كل درس متقسم فيديوهات قصيرة</p></div>
<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800"><h3 class="font-bold text-xl">📝 اختبارات</h3><p class="text-gray-400 mt-2">اختبر نفسك بعد كل وحدة</p></div>
<div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800"><h3 class="font-bold text-xl">📄 مذكرات PDF</h3><p class="text-gray-400 mt-2">حمل المذكرات بضغطة زر</p></div>
</div>
</section>
<p class="text-center text-zinc-600 mt-20 pb-10">تم بواسطة مهدي - 2026</p>
</body>
</html>
